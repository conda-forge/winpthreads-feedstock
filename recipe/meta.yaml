{% set version = '12.0.0.r688.g6b2176247-1' %}

package:
  name: winpthreads-split
  version: {{ version.replace("-", ".") }}

source:
  - url:
      - https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-libwinpthread-git-{{ version }}-any.pkg.tar.zst
      # archive since the package link above expires when new versions appear.
      - https://github.com/conda-forge/msys2-recipes/releases/download/20261026/mingw-w64-ucrt-x86_64-libwinpthread-git-{{ version }}-any.pkg.tar.zst
    sha256: 05c3e3024c35278d3a217785df3948a848d75c3c17f84c80783ef9fe3cb85247
    folder: binary-libwinpthread

  - url:
      - https://repo.msys2.org/mingw/clangarm64/mingw-w64-clang-aarch64-libwinpthread-git-{{ version }}-any.pkg.tar.zst
      # archive since the package link above expires when new versions appear.
      - https://github.com/conda-forge/msys2-recipes/releases/download/20261026/mingw-w64-clang-aarch64-libwinpthread-git-{{ version }}-any.pkg.tar.zst
    sha256: 451c9fe12256e80e4aac7052b143189e12b3cfe0de5ddf29fc10b2f157448097
    folder: binary-libwinpthread-arm64

  - url:
      - https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-winpthreads-git-{{ version }}-any.pkg.tar.zst
      # archive since the package link above expires when new versions appear.
      - https://github.com/conda-forge/msys2-recipes/releases/download/20261026/mingw-w64-ucrt-x86_64-winpthreads-git-{{ version }}-any.pkg.tar.zst
    sha256: ed6d80069bd2c2100e54ce680db14eb6f263ae81419c79a0d64ee2dc89e17914
    folder: binary-winpthreads

  - url:
      - https://repo.msys2.org/mingw/clangarm64/mingw-w64-clang-aarch64-winpthreads-git-{{ version }}-any.pkg.tar.zst
      # archive since the package link above expires when new versions appear.
      - https://github.com/conda-forge/msys2-recipes/releases/download/20261026/mingw-w64-clang-aarch64-winpthreads-git-{{ version }}-any.pkg.tar.zst
    sha256: 9103d81d768ad637caea26e5da3d156d716cb2723acd179776548b2194a80e4b
    folder: binary-winpthreads-arm64

  - url:
      # archive them for license compliance
      - https://repo.msys2.org/mingw/sources/mingw-w64-winpthreads-git-{{ version }}.src.tar.zst
      - https://github.com/conda-forge/msys2-recipes/releases/download/20261026/mingw-w64-winpthreads-git-{{ version }}.src.tar.zst
    sha256: 084e714ff6a3a939539773febcf65731eba384d7f037dc36ff82d42d50fae078
    folder: src-winpthread

build:
  number: 0
  skip: True  # [not win]

outputs:
  - name: libwinpthread
    script: install_libwinpthread.bat
    files:
      - Library/bin/libwinpthread-1.dll
    requirements:
      run:
      run_constrained:
        - msys2-conda-epoch <0.0a0
        - pthreads-win32 <0.0a0
    test:
      commands:
        - if not exist %LIBRARY_BIN%\libwinpthread-1.dll exit 1
    about:
      home: https://mingw-w64.sourceforge.io/
      license: MIT
      license_file: binary-libwinpthread/ucrt64/share/licenses/libwinpthread/
      summary: DLLs for MinGW-w64 winpthreads library

  - name: winpthreads
    script: install_winpthreads.bat
    files:
      - Library/lib
      - Library/include
    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
      host:
        - {{ pin_subpackage("libwinpthread", exact=True) }}
      run:
        - {{ pin_subpackage("libwinpthread", exact=True) }}
      run_constrained:
        - msys2-conda-epoch <0.0a0
        - pthreads-win32 <0.0a0
    test:
      commands:
        - if not exist %LIBRARY_INC%\pthread.h exit 1
        - if not exist %LIBRARY_INC%\sched.h exit 1
        - if not exist %LIBRARY_LIB%\libpthread.dll.a exit 1
        - if not exist %LIBRARY_LIB%\pthread.lib exit 1
    about:
      home: https://mingw-w64.sourceforge.io/
      license: MIT
      license_file: binary-libwinpthread/ucrt64/share/licenses/libwinpthread/
      summary: Development files for MinGW-w64 winpthreads library

about:
  home: https://mingw-w64.sourceforge.io/
  license: MIT
  license_file: binary-libwinpthread/ucrt64/share/licenses/libwinpthread/
  summary: |
    Repackaged winpthreads library

extra:
  feedstock-name: winpthreads
  recipe-maintainers:
    - isuruf
